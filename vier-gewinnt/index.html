<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SCHWERKRAFT · Vier gewinnt</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23f0a33c'/><circle cx='50' cy='50' r='26' fill='none' stroke='%238a6a3a' stroke-width='7'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: oklch(0.16 0.015 65);
    --ivory: oklch(0.93 0.02 80);
    --ivory-dim: oklch(0.72 0.025 75);
    --ember: oklch(0.78 0.15 70);
    --ember-deep: oklch(0.62 0.13 60);
    --garnet: oklch(0.50 0.16 28);
    --brass: oklch(0.62 0.09 80);
    --panel: oklch(0.21 0.02 65);
    --line: oklch(0.34 0.03 70);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; }
  body{
    background: var(--bg-deep);
    color: var(--ivory);
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage{ position:fixed; inset:0; display:block; cursor:grab; touch-action:none; }
  #stage.dragging{ cursor:grabbing; }

  /* Vignette over the 3D stage */
  .vignette{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background: radial-gradient(ellipse 120% 90% at 50% 42%, transparent 55%, oklch(0.1 0.015 65 / 0.55) 100%);
  }

  .hud{ position:fixed; z-index:5; }

  /* Title block */
  .masthead{ top:clamp(16px,3vh,32px); left:clamp(18px,3vw,40px); }
  .masthead h1{
    font-family:"Anton", sans-serif;
    font-size: clamp(34px, 4.6vw, 64px);
    letter-spacing: 0.04em;
    line-height: 0.95;
    color: var(--ivory);
    text-shadow: 0 2px 24px oklch(0.78 0.15 70 / 0.25);
  }
  .masthead h1 .ember{ color: var(--ember); }
  .masthead .sub{
    margin-top: 6px;
    font-size: clamp(11px, 1.1vw, 14px);
    font-weight: 600;
    letter-spacing: 0.32em;
    color: var(--ivory-dim);
  }

  /* Difficulty segmented control */
  .difficulty{
    margin-top: 16px;
    display: flex;
    width: max-content;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .difficulty button{
    border: none; border-radius: 0;
    background: transparent;
    color: var(--ivory-dim);
    font-size: 11px;
    letter-spacing: 0.14em;
    padding: 8px 13px;
  }
  .difficulty button + button{ border-left: 1px solid var(--line); }
  .difficulty button:hover:not(.active){ background: oklch(0.25 0.03 65); color: var(--ivory); }
  .difficulty button.active{
    background: var(--ember);
    color: oklch(0.2 0.04 60);
  }

  /* Controls top right */
  .controls{ top:clamp(16px,3vh,32px); right:clamp(18px,3vw,40px); display:flex; gap:10px; }
  button{
    font-family:"Hanken Grotesk", sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: var(--ivory);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 16px;
    cursor: pointer;
    transition: border-color .25s var(--ease-out), background .25s var(--ease-out), transform .15s var(--ease-out);
  }
  button:hover{ border-color: var(--ember-deep); background: oklch(0.25 0.03 65); }
  button:active{ transform: translateY(1px); }
  button.primary{
    background: var(--ember);
    color: oklch(0.2 0.04 60);
    border-color: transparent;
  }
  button.primary:hover{ background: oklch(0.83 0.15 72); }

  /* Status bar bottom center */
  .status{
    bottom: clamp(18px, 4vh, 40px); left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none;
  }
  .status .turn{
    font-family:"Anton", sans-serif;
    font-size: clamp(18px, 2vw, 26px);
    letter-spacing: 0.18em;
    display:flex; align-items:center; gap:12px; justify-content:center;
    transition: color .3s;
  }
  .status .dot{
    width:14px; height:14px; border-radius:50%;
    background: var(--ember);
    box-shadow: 0 0 14px oklch(0.78 0.15 70 / 0.8);
    transition: background .3s, box-shadow .3s;
  }
  .status.cpu .dot{ background: var(--garnet); box-shadow: 0 0 14px oklch(0.5 0.16 28 / 0.8); }
  .status .hint{
    margin-top: 10px;
    font-size: 12px; font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--ivory-dim);
  }
  kbd{
    font-family: inherit; font-weight: 700; font-size: 11px;
    border: 1px solid var(--line); border-radius: 3px;
    padding: 1px 5px; color: var(--ivory);
  }

  /* Leaderboard aside */
  .board-aside{
    position: fixed; z-index: 6;
    top: 0; right: 0; height: 100%;
    width: min(340px, 88vw);
    background: oklch(0.18 0.02 65 / 0.97);
    border-left: 1px solid var(--line);
    transform: translateX(105%);
    transition: transform .5s var(--ease-out);
    padding: clamp(20px, 4vh, 36px) 28px;
    display: flex; flex-direction: column;
  }
  .board-aside.open{ transform: translateX(0); }
  .board-aside h2{
    font-family:"Anton", sans-serif;
    font-size: 26px; letter-spacing: 0.1em;
    color: var(--ember);
  }
  .board-aside .close{
    position:absolute; top:18px; right:16px;
    padding: 6px 10px; font-size: 12px;
  }
  .lb-list{ list-style:none; margin-top: 22px; overflow-y:auto; }
  .lb-list li{
    display: grid;
    grid-template-columns: 30px 1fr auto;
    gap: 10px; align-items: baseline;
    padding: 11px 4px;
    border-bottom: 1px solid oklch(0.28 0.025 65);
  }
  .lb-list li.fresh{ background: oklch(0.78 0.15 70 / 0.1); }
  .lb-list .rank{ font-family:"Anton",sans-serif; color: var(--ivory-dim); font-size: 15px; }
  .lb-list li:first-child .rank{ color: var(--ember); }
  .lb-list .who{ font-weight: 600; font-size: 15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-list .meta{ display:block; font-size:11px; font-weight:400; color:var(--ivory-dim); margin-top:2px; }
  .lb-list .pts{ font-family:"Anton",sans-serif; font-size: 19px; color: var(--ivory); }
  .lb-empty{ margin-top: 26px; color: var(--ivory-dim); font-size: 14px; line-height: 1.6; }

  /* End-of-round stage overlay */
  .finale{
    position: fixed; inset: 0; z-index: 8;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    background: radial-gradient(ellipse 70% 55% at 50% 46%, oklch(0.13 0.02 60 / 0.82), oklch(0.13 0.02 60 / 0.35) 70%, transparent);
    opacity: 0; pointer-events: none;
    transition: opacity .6s var(--ease-out);
  }
  .finale.show{ opacity: 1; pointer-events: auto; }
  .finale .verdict{
    font-family:"Anton", sans-serif;
    font-size: clamp(56px, 11vw, 150px);
    letter-spacing: 0.05em;
    line-height: 1;
    color: var(--ember);
    text-shadow: 0 0 60px oklch(0.78 0.15 70 / 0.45);
    transform: scale(0.86);
    transition: transform .7s var(--ease-out);
  }
  .finale.show .verdict{ transform: scale(1); }
  .finale.loss .verdict{ color: var(--garnet); text-shadow: 0 0 60px oklch(0.5 0.16 28 / 0.5); }
  .finale.draw .verdict{ color: var(--ivory-dim); text-shadow: none; }
  .finale .detail{
    font-size: clamp(13px, 1.4vw, 17px);
    letter-spacing: 0.22em; font-weight: 600;
    color: var(--ivory);
  }
  .finale .scoreline{
    font-family:"Anton",sans-serif;
    font-size: clamp(20px, 2.6vw, 34px);
    letter-spacing: 0.12em;
    color: var(--ivory);
    margin-top: 6px;
  }
  .finale form{ display:flex; gap:10px; margin-top: 22px; }
  .finale input{
    font-family:"Hanken Grotesk",sans-serif;
    font-size: 15px; font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--ivory);
    background: oklch(0.22 0.02 65);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 11px 14px;
    width: 210px;
    outline: none;
  }
  .finale input:focus{ border-color: var(--ember-deep); }
  .finale .again{ margin-top: 22px; padding: 13px 30px; font-size: 14px; }

  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  button{ touch-action: manipulation; }

  /* way back to the website */
  .home{
    display: inline-block; margin-top: 12px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
    color: var(--ivory-dim); text-decoration: none;
  }
  .home:hover{ color: var(--ember); }

  @media (max-width: 640px){
    .masthead .sub{ display:none; }
    .status .hint{ display:none; }
    /* the three buttons move to a row at the bottom; the turn indicator sits above them */
    .controls{
      top: auto; right: 0; left: 0;
      bottom: calc(14px + env(safe-area-inset-bottom));
      justify-content: center; gap: 8px;
    }
    .controls button{ padding: 9px 11px; font-size: 11px; letter-spacing: 0.1em; }
    .status{ bottom: calc(68px + env(safe-area-inset-bottom)); }
    .masthead{ top: calc(14px + env(safe-area-inset-top)); left: 16px; }
    .difficulty{ margin-top: 10px; }
    .finale input{ width: 160px; }
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<header class="hud masthead">
  <h1>SCHWER<span class="ember">KRAFT</span></h1>
  <p class="sub">VIER GEWINNT · ARENA</p>
  <div class="difficulty" role="group" aria-label="Schwierigkeitsgrad">
    <button data-d="leicht">LEICHT</button>
    <button data-d="mittel">MITTEL</button>
    <button data-d="schwer">SCHWER</button>
  </div>
  <a class="home" href="../">← LUKAS NETZ</a>
</header>

<nav class="hud controls">
  <button id="btn-sound" aria-pressed="false">TON AUS</button>
  <button id="btn-lb">BESTENLISTE</button>
  <button id="btn-restart" class="primary">NEUE RUNDE</button>
</nav>

<div class="hud status" id="status">
  <div class="turn"><span class="dot"></span><span id="turn-text">DEIN ZUG</span></div>

</div>

<aside class="board-aside" id="lb-panel" aria-label="Bestenliste">

  <h2>BESTENLISTE</h2>
  <ol class="lb-list" id="lb-list"></ol>
  <p class="lb-empty" id="lb-empty">Noch keine Siege verewigt.<br>Schlag die Maschine und trag dich ein.</p>
</aside>

<div class="finale" id="finale">

  <form id="name-form" autocomplete="off">
    <input id="name-input" maxlength="16" placeholder="DEIN NAME" aria-label="Name für die Bestenliste">
    <button type="submit" class="primary">EINTRAGEN</button>
  </form>
  <button class="again" id="btn-again">NOCHMAL</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   CONSTANTS
============================================================ */
const COLS = 7, ROWS = 6;
const HU = 1, AI = 2;                       // grid cell owners
const CELL = 1.06;
const DISC_R = 0.47, DISC_T = 0.34;
const HOLE_R = 0.40;
const PLATE_W = COLS * CELL + 0.66;
const PLATE_H = ROWS * CELL + 0.66;
const GRAVITY = 75;                          // ≈ 9.81 m/s² at board scale (1 unit ≈ 13 cm)
const RESTITUTION = 0.32;
const BOARD_Y = 0.25;                        // board group lift
const FLOOR_Y = BOARD_Y - PLATE_H / 2 - 1.18;
const SPILL_ANGLE = 2.6;                     // rad (~149°) triggers the spill
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

const cellX = c => (c - (COLS - 1) / 2) * CELL;
const cellY = r => (r - (ROWS - 1) / 2) * CELL;
const SPAWN_Y = cellY(ROWS - 1) + 1.6;       // discs drop in from here (board-local)

/* ============================================================
   GAME STATE
============================================================ */
const grid = [];                             // grid[col][row], row 0 = bottom
const heights = new Array(COLS).fill(0);
let state = 'player';                        // player | dropping | ai | over | spilling
let pieces = [];                             // { mesh, col, row, owner }
let fallers = [];                            // spilled / loose discs in world space
let playerMoves = 0, totalMoves = 0, roundStart = 0;
let pendingAiTimer = 0;
let lastResult = null;                       // { won, score, moves, secs }

function resetGrid() {
  for (let c = 0; c < COLS; c++) { grid[c] = new Array(ROWS).fill(0); heights[c] = 0; }
  playerMoves = 0; totalMoves = 0; roundStart = 0;
}
resetGrid();

/* ============================================================
   AI · minimax with alpha-beta, medium tuning
============================================================ */
const ORDER = [3, 2, 4, 1, 5, 0, 6];
/* depth = minimax lookahead, blunder = chance to take the 2nd-best move,
   mult = leaderboard score multiplier */
const DIFFS = {
  leicht: { depth: 2, blunder: 0.45, mult: 0.5, label: 'LEICHT' },
  mittel: { depth: 4, blunder: 0.22, mult: 1,   label: 'MITTEL' },
  schwer: { depth: 9, blunder: 0,    mult: 2,   label: 'SCHWER' }
};
let diffKey = localStorage.getItem('sk-diff');
if (!DIFFS[diffKey]) diffKey = 'mittel';

function isWinFrom(c, r, p) {
  const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
  for (const [dc, dr] of dirs) {
    let n = 1;
    for (const s of [1, -1]) {
      let cc = c + dc * s, rr = r + dr * s;
      while (cc >= 0 && cc < COLS && rr >= 0 && rr < ROWS && grid[cc][rr] === p) {
        n++; cc += dc * s; rr += dr * s;
      }
    }
    if (n >= 4) return true;
  }
  return false;
}

function winLine(c, r, p) {
  const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
  for (const [dc, dr] of dirs) {
    const line = [[c, r]];
    for (const s of [1, -1]) {
      let cc = c + dc * s, rr = r + dr * s;
      while (cc >= 0 && cc < COLS && rr >= 0 && rr < ROWS && grid[cc][rr] === p) {
        line.push([cc, rr]); cc += dc * s; rr += dr * s;
      }
    }
    if (line.length >= 4) return line;
  }
  return null;
}

const WINDOW_SCORE = [0, 2, 14, 70];
function evalBoard() {
  let s = 0;
  const win = (a, b, c2, d) => {
    let ai = 0, hu = 0;
    for (const v of [a, b, c2, d]) { if (v === AI) ai++; else if (v === HU) hu++; }
    if (ai && hu) return 0;
    if (ai) return WINDOW_SCORE[ai];
    if (hu) return -WINDOW_SCORE[hu] * 1.1;  // value defense slightly higher
    return 0;
  };
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
    if (c + 3 < COLS) s += win(grid[c][r], grid[c+1][r], grid[c+2][r], grid[c+3][r]);
    if (r + 3 < ROWS) s += win(grid[c][r], grid[c][r+1], grid[c][r+2], grid[c][r+3]);
    if (c + 3 < COLS && r + 3 < ROWS) s += win(grid[c][r], grid[c+1][r+1], grid[c+2][r+2], grid[c+3][r+3]);
    if (c + 3 < COLS && r - 3 >= 0) s += win(grid[c][r], grid[c+1][r-1], grid[c+2][r-2], grid[c+3][r-3]);
  }
  for (let r = 0; r < ROWS; r++) {            // center control
    if (grid[3][r] === AI) s += 3;
    else if (grid[3][r] === HU) s -= 3;
  }
  return s;
}

function place(c, p) { grid[c][heights[c]] = p; heights[c]++; }
function unplace(c) { heights[c]--; grid[c][heights[c]] = 0; }

function minimax(depth, alpha, beta, maximizing) {
  if (depth === 0) return evalBoard();
  const moves = ORDER.filter(c => heights[c] < ROWS);
  if (!moves.length) return 0;
  if (maximizing) {
    let best = -Infinity;
    for (const c of moves) {
      place(c, AI);
      const v = isWinFrom(c, heights[c] - 1, AI)
        ? 100000 + depth * 100
        : minimax(depth - 1, alpha, beta, false);
      unplace(c);
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (const c of moves) {
      place(c, HU);
      const v = isWinFrom(c, heights[c] - 1, HU)
        ? -(100000 + depth * 100)
        : minimax(depth - 1, alpha, beta, true);
      unplace(c);
      if (v < best) best = v;
      if (v < beta) beta = v;
      if (alpha >= beta) break;
    }
    return best;
  }
}

function aiChooseMove() {
  const { depth, blunder } = DIFFS[diffKey];
  const scored = [];
  for (const c of ORDER) {
    if (heights[c] >= ROWS) continue;
    place(c, AI);
    const v = isWinFrom(c, heights[c] - 1, AI)
      ? 1000000
      : minimax(depth - 1, -Infinity, Infinity, false);
    unplace(c);
    scored.push({ c, v });
  }
  scored.sort((a, b) => b.v - a.v);
  const best = scored[0];
  // Occasionally take the runner-up, but never skip a win
  // and never walk into an immediate loss.
  if (scored.length > 1 && Math.random() < blunder
      && best.v < 900000 && scored[1].v > -90000) {
    return scored[1].c;
  }
  return best.c;
}

/* ============================================================
   AUDIO · all synthesized, zero assets
============================================================ */
let audioCtx = null, masterGain = null, noiseBuf = null;
let muted = localStorage.getItem('sk-muted') === '1';

function ensureAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = muted ? 0 : 0.9;
  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 6;
  masterGain.connect(comp).connect(audioCtx.destination);
  const len = audioCtx.sampleRate * 1;
  noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}

function noiseHit({ filterType = 'lowpass', freq = 500, dur = 0.08, gain = 0.3, when = 0 }) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + when;
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf;
  const f = audioCtx.createBiquadFilter();
  f.type = filterType; f.frequency.value = freq;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(masterGain);
  src.start(t); src.stop(t + dur + 0.02);
}

function tone({ type = 'sine', from = 440, to = from, dur = 0.2, gain = 0.2, when = 0 }) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + when;
  const o = audioCtx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(from, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(masterGain);
  o.start(t); o.stop(t + dur + 0.02);
}

const sfx = {
  whoosh()      { noiseHit({ filterType: 'bandpass', freq: 700, dur: 0.28, gain: 0.10 }); },
  impact(v)     {                              // v = impact speed
    const k = Math.min(1, v / 32);
    tone({ type: 'sine', from: 95 + k * 35, to: 38, dur: 0.22 + k * 0.1, gain: 0.4 + k * 0.45 });
    noiseHit({ freq: 420, dur: 0.07, gain: 0.25 + k * 0.3 });
  },
  boom(p = 1)   {                              // explosion: sub drop + body + crack
    tone({ type: 'sine', from: 72, to: 24, dur: 0.5 + 0.25 * p, gain: 0.6 * p });
    noiseHit({ freq: 240, dur: 0.38, gain: 0.4 * p });
    noiseHit({ filterType: 'highpass', freq: 2600, dur: 0.06, gain: 0.22 * p });
  },
  clack(v = 1)  {
    noiseHit({ filterType: 'highpass', freq: 1600, dur: 0.035, gain: 0.16 * v });
    tone({ type: 'triangle', from: 1900, to: 1100, dur: 0.04, gain: 0.08 * v });
  },
  tick()        { tone({ type: 'square', from: 850, to: 850, dur: 0.018, gain: 0.025 }); },
  denied()      { tone({ type: 'sawtooth', from: 180, to: 130, dur: 0.15, gain: 0.12 }); },
  fanfare()     {
    [523, 659, 784, 1047, 1319].forEach((f, i) =>
      tone({ type: 'triangle', from: f, to: f, dur: 0.5, gain: 0.18, when: i * 0.11 }));
    tone({ type: 'sine', from: 70, to: 45, dur: 0.7, gain: 0.5 });
  },
  defeat()      {
    [311, 247, 196].forEach((f, i) =>
      tone({ type: 'sawtooth', from: f, to: f * 0.97, dur: 0.45, gain: 0.1, when: i * 0.22 }));
    tone({ type: 'sine', from: 80, to: 35, dur: 1.0, gain: 0.35, when: 0.1 });
  },
  draw()        { [330, 330].forEach((f, i) => tone({ type: 'triangle', from: f, to: f, dur: 0.3, gain: 0.12, when: i * 0.25 })); },
  spill(n)      {
    for (let i = 0; i < Math.min(n, 14); i++) {
      noiseHit({ filterType: 'highpass', freq: 1300 + Math.random() * 800, dur: 0.04, gain: 0.12, when: 0.1 + Math.random() * 0.9 });
    }
    tone({ type: 'sine', from: 60, to: 38, dur: 0.5, gain: 0.4 });
  }
};

function roundedRectShape(w, h, rad) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + rad, y);
  s.lineTo(x + w - rad, y);  s.quadraticCurveTo(x + w, y, x + w, y + rad);
  s.lineTo(x + w, y + h - rad); s.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  s.lineTo(x + rad, y + h);  s.quadraticCurveTo(x, y + h, x, y + h - rad);
  s.lineTo(x, y + rad);      s.quadraticCurveTo(x, y, x + rad, y);
  return s;
}

function buildPlate() {
  const shape = roundedRectShape(PLATE_W, PLATE_H, 0.3);
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
    const hole = new THREE.Path();
    hole.absarc(cellX(c), cellY(r), HOLE_R, 0, Math.PI * 2, true);
    shape.holes.push(hole);

  return new THREE.ExtrudeGeometry(shape, {
    depth: 0.13, bevelEnabled: true, bevelThickness: 0.02,
    bevelSize: 0.02, bevelSegments: 2, curveSegments: 28
  });
}

function makeSpriteTex() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const ctx = cv.getContext('2d');
  const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.35, 'rgba(255,230,190,0.7)');
  grad.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(cv);
  return tex;
}
const spriteTex = makeSpriteTex();

const MAXP = 420;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(MAXP * 3);
const pCol = new Float32Array(MAXP * 3);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pVel = new Float32Array(MAXP * 3);
const pLife = new Float32Array(MAXP);
const pMax = new Float32Array(MAXP);
const pBase = new Float32Array(MAXP * 3);    // base color
let pCursor = 0;
for (let i = 0; i < MAXP; i++) pPos[i * 3 + 1] = 9999;

const points = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.13, map: spriteTex, vertexColors: true, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(points);

function spawnBurst(worldPos, count, { speed = 5, color = new THREE.Color('#ffba56'), spread = 1, up = 2.5 } = {}) {
  for (let n = 0; n < count; n++) {
    const i = pCursor; pCursor = (pCursor + 1) % MAXP;
    pPos[i * 3] = worldPos.x; pPos[i * 3 + 1] = worldPos.y; pPos[i * 3 + 2] = worldPos.z;
    const a = Math.random() * Math.PI * 2;
    const v = speed * (0.3 + Math.random() * 0.7);
    pVel[i * 3] = Math.cos(a) * v * spread;
    pVel[i * 3 + 1] = Math.random() * up + 0.5;
    pVel[i * 3 + 2] = Math.sin(a) * v * spread * 0.6 + 0.8;
    pLife[i] = pMax[i] = 0.4 + Math.random() * 0.5;
    pBase[i * 3] = color.r; pBase[i * 3 + 1] = color.g; pBase[i * 3 + 2] = color.b;
  }
}

function updateParticles(dt) {
  for (let i = 0; i < MAXP; i++) {
    if (pLife[i] <= 0) continue;
    pLife[i] -= dt;
    if (pLife[i] <= 0) { pPos[i * 3 + 1] = 9999; continue; }
    pVel[i * 3 + 1] -= GRAVITY * 0.22 * dt;   // sparks stay floaty
    pPos[i * 3] += pVel[i * 3] * dt;
    pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt;
    pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
    const k = pLife[i] / pMax[i];
    pCol[i * 3] = pBase[i * 3] * k; pCol[i * 3 + 1] = pBase[i * 3 + 1] * k; pCol[i * 3 + 2] = pBase[i * 3 + 2] * k;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

/* Ambient embers drifting up through the stage light */

const eGeo = new THREE.BufferGeometry();

function updateEmbers(dt, t) {
  for (let i = 0; i < EMBERS; i++) {
    ePos[i * 3 + 1] += eSpd[i] * dt;
    ePos[i * 3] += Math.sin(t * 0.7 + i * 1.7) * 0.12 * dt;
    if (ePos[i * 3 + 1] > FLOOR_Y + 13) ePos[i * 3 + 1] = FLOOR_Y;

/* Impact ring + flash light */
const ringMat = new THREE.MeshBasicMaterial({
  color: '#ffc878', transparent: true, opacity: 0,
  blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
});
const impactRing = new THREE.Mesh(new THREE.RingGeometry(0.4, 0.55, 40), ringMat);
impactRing.visible = false;
scene.add(impactRing);
let ringT = 1, ringPower = 1;

const flash = new THREE.PointLight('#ffba56', 0, 8);
scene.add(flash);
let flashT = 1;

let shake = 0;

function impactFX(worldPos, v) {
  const k = Math.min(1, v / 32);
  spawnBurst(worldPos, Math.round(10 + k * 26), { speed: 2.5 + k * 5, up: 1.5 + k * 3 });
  impactRing.position.copy(worldPos);
  impactRing.position.z += 0.45;
  impactRing.quaternion.copy(rollGroup.getWorldQuaternion(new THREE.Quaternion()));
  impactRing.visible = true;
  ringT = 0; ringPower = 1;
  flash.color.set('#ffba56');
  flash.position.copy(worldPos).z += 1.2;
  flash.intensity = 6 + k * 16;
  flashT = 0;
  if (!REDUCED_MOTION) shake = Math.max(shake, 0.04 + k * 0.13);
  sfx.impact(v);
  vibrate(Math.round(15 + k * 45));
  // hard landings detonate
  if (k > 0.62) {
    spawnBurst(worldPos, Math.round(26 * k), { speed: 9 * k, up: 4.5, color: new THREE.Color('#fff3dc') });
    spawnBurst(worldPos, Math.round(16 * k), { speed: 4, up: 2, color: new THREE.Color('#b3501e') });
    ringPower = 1 + k * 0.6;
    sfx.boom(k * 0.8);
  }
}

/* Full detonation: layered fireball, shockwave, flash, boom, shake */
function explode(worldPos, power = 1, color = '#ffba56') {
  spawnBurst(worldPos, Math.round(36 * power), { speed: 6 + 6 * power, up: 4 + 3 * power, color: new THREE.Color('#fff3dc') });
  spawnBurst(worldPos, Math.round(28 * power), { speed: 3.5 + 4 * power, up: 2.5, color: new THREE.Color(color) });
  spawnBurst(worldPos, Math.round(18 * power), { speed: 2.2, up: 1.6, color: new THREE.Color('#b3501e') });
  impactRing.position.copy(worldPos);
  impactRing.position.z += 0.45;
  impactRing.quaternion.copy(rollGroup.getWorldQuaternion(new THREE.Quaternion()));
  impactRing.visible = true;
  ringT = 0; ringPower = 1 + power;
  flash.color.set(color);
  flash.position.copy(worldPos).z += 1.2;
  flash.intensity = 14 + power * 22;
  flashT = 0;
  if (!REDUCED_MOTION) shake = Math.max(shake, 0.08 + power * 0.12);
  sfx.boom(power);
  vibrate(Math.round(30 + power * 60));
}

/* ============================================================
   DROP · hand-rolled gravity with bounce
============================================================ */
let dropping = null;   // { mesh, col, row, owner, vy, targetY, contacts }

function startDrop(col, owner) {
  const row = heights[col];
  const mesh = makeDisc(owner);
  mesh.position.set(cellX(col), SPAWN_Y, 0);
  rollGroup.add(mesh);
  dropping = { mesh, col, row, owner, vy: 0, targetY: cellY(row), contacts: 0 };
  state = 'dropping';
  ghost.visible = false; beam.visible = false;
  sfx.whoosh();
}

function updateDrop(dt) {
  if (!dropping) return;
  const d = dropping;
  d.vy -= GRAVITY * dt;
  d.mesh.position.y += d.vy * dt;
  if (d.mesh.position.y <= d.targetY) {
    d.mesh.position.y = d.targetY;
    const speed = Math.abs(d.vy);
    if (speed > 2.4 && d.contacts < 3) {
      d.contacts++;
      const wp = d.mesh.getWorldPosition(new THREE.Vector3());
      if (d.contacts === 1) impactFX(wp, speed);
      else { sfx.clack(speed / 8); spawnBurst(wp, 4, { speed: 1.5, up: 1 }); }
      d.vy = speed * RESTITUTION;
    } else {
      d.vy = 0;
      settleDrop();
    }
  }
}

function settleDrop() {
  const d = dropping;
  dropping = null;
  grid[d.col][d.row] = d.owner;
  heights[d.col]++;
  pieces.push({ mesh: d.mesh, col: d.col, row: d.row, owner: d.owner });
  totalMoves++;

  const line = winLine(d.col, d.row, d.owner);
  if (line) return endRound(d.owner, line);
  if (totalMoves >= COLS * ROWS) return endRound(0, null);

  if (d.owner === HU) {
    state = 'ai';
    setStatus('cpu', 'GEGNER DENKT …');
    pendingAiTimer = setTimeout(() => {
      if (state !== 'ai') return;
      startDrop(aiChooseMove(), AI);
    }, 480 + Math.random() * 520);
  } else {
    state = 'player';
    setStatus('player', 'DEIN ZUG');
  }
}

/* ============================================================
   ROUND END · win / loss / draw
============================================================ */
const finaleEl = document.getElementById('finale');
const verdictEl = document.getElementById('verdict');
const detailEl = document.getElementById('finale-detail');
const scoreEl = document.getElementById('finale-score');
const nameForm = document.getElementById('name-form');
const nameInput = document.getElementById('name-input');

function endRound(winner, line) {
  state = 'over';
  const secs = Math.max(1, Math.round((performance.now() - roundStart) / 1000));

  if (line) {
    winDiscs = pieces.filter(p => line.some(([c, r]) => c === p.col && r === p.row));
    const [c0, r0] = line[0], [c1, r1] = line[line.length - 1];
    const a = new THREE.Vector3(cellX(c0), cellY(r0), 0);
    const b = new THREE.Vector3(cellX(c1), cellY(r1), 0);
    const mid = a.clone().add(b).multiplyScalar(0.5);
    winBeam.position.copy(mid);
    winBeam.scale.set(1, a.distanceTo(b) + 0.8, 1);
    winBeam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
    winBeam.visible = true;
  }

  finaleEl.classList.remove('loss', 'draw');
  nameForm.style.display = 'none';
  scoreEl.textContent = '';

  if (winner === HU) {
    const d = DIFFS[diffKey];
    const score = Math.round(Math.max(120, 1200 - playerMoves * 40 - secs * 2) * d.mult);
    lastResult = { won: true, score, moves: playerMoves, secs, diff: d.label };
    verdictEl.textContent = 'TRIUMPH';
    detailEl.textContent = `${d.label} · ${playerMoves} ZÜGE · ${secs} S`;
    scoreEl.textContent = `${score} PUNKTE`;
    nameForm.style.display = 'flex';
    nameInput.value = localStorage.getItem('sk-name') || '';
    sfx.fanfare();
    vibrate([60, 40, 60, 40, 120]);
    // the winning line detonates disc by disc
    winDiscs.forEach((p, i) => {
      setTimeout(() => {
        explode(p.mesh.getWorldPosition(new THREE.Vector3()), 1.2, '#ffd27a');
      }, 250 + i * 230);
    });
  } else if (winner === AI) {
    lastResult = { won: false };
    verdictEl.textContent = 'ZERSCHMETTERT';
    detailEl.textContent = 'DIE MASCHINE TRIUMPHIERT';
    sfx.defeat();
    vibrate([200]);
    winDiscs.forEach((p, i) => {
      setTimeout(() => {
        explode(p.mesh.getWorldPosition(new THREE.Vector3()), 0.8, '#d4452e');
      }, 250 + i * 230);
    });
  } else {
    lastResult = { won: false };
    finaleEl.classList.add('draw');
    verdictEl.textContent = 'PATT';
    detailEl.textContent = 'KEIN STEIN ZU VIEL, KEINER ZU WENIG';
    sfx.draw();
  }
  if (winner === AI) finaleEl.classList.add('loss');
  setTimeout(() => finaleEl.classList.add('show'), line ? 1450 : 250);
  setStatus(winner === HU ? 'player' : 'cpu', 'RUNDE BEENDET');
}

const lbEmpty = document.getElementById('lb-empty');

function loadLB() {
  try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; }
  catch { return []; }
}

function renderLB(freshName) {
  const entries = loadLB();
  lbList.innerHTML = '';
  lbEmpty.style.display = entries.length ? 'none' : 'block';
  entries.forEach((e, i) => {
    const li = document.createElement('li');
    if (freshName && e.name === freshName && e.fresh) li.classList.add('fresh');
    const date = new Date(e.date).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
    li.innerHTML = `<span class="rank">${i + 1}</span>
      <span class="who">${escapeHtml(e.name)}<span class="meta">${e.diff || 'MITTEL'} · ${e.moves} Züge · ${e.secs} s · ${date}</span></span>
      <span class="pts">${e.score}</span>`;
    lbList.appendChild(li);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

nameForm.addEventListener('submit', e => {
  e.preventDefault();
  if (!lastResult?.won) return;
  const name = (nameInput.value.trim() || 'SPIELER').slice(0, 16);
  localStorage.setItem('sk-name', name);
  const entries = loadLB();
  entries.forEach(en => delete en.fresh);
  entries.push({ name, score: lastResult.score, moves: lastResult.moves, secs: lastResult.secs, diff: lastResult.diff, date: Date.now(), fresh: true });
  entries.sort((a, b) => b.score - a.score);
  localStorage.setItem(LB_KEY, JSON.stringify(entries.slice(0, 10)));
  nameForm.style.display = 'none';
  renderLB(name);
  lbPanel.classList.add('open');
  sfx.clack(1.5);
});

document.getElementById('btn-lb').addEventListener('click', () => {
  ensureAudio(); renderLB(); lbPanel.classList.toggle('open'); sfx.tick();
});
document.getElementById('btn-lb-close').addEventListener('click', () => lbPanel.classList.remove('open'));

/* ============================================================
   FLIP / SPILL · grab the board, turn it upside down
============================================================ */
let roll = 0, rollVel = 0;                     // forward pitch of the board (X axis)
let draggingBoard = false, dragStartY = 0, rollAtDragStart = 0;
const DRAG_TO_PITCH = 0.011;                   // rad per pixel of vertical drag
let autoFlip = null;                 // { t } restart-button animation
let spilledThisFlip = false;
let resetTimer = 0;

function wrapAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

function spillPieces() {
  if (spilledThisFlip) return;
  spilledThisFlip = true;
  clearTimeout(pendingAiTimer);
  state = 'spilling';
  finaleEl.classList.remove('show');
  winBeam.visible = false;
  winDiscs = [];
  ghost.visible = false; beam.visible = false;

  const all = [...pieces];
  if (dropping) { all.push(dropping); dropping = null; }
  setStatus('player', 'NEUSTART …');
  if (all.length >= 4) {
    explode(tiltGroup.getWorldPosition(new THREE.Vector3()), 0.9);
  }
  sfx.spill(all.length);
  vibrate([30, 30, 30, 30, 80]);

  for (const p of all) {
    const mesh = p.mesh;
    scene.attach(mesh);                       // keep world transform
    mesh.traverse(o => { if (o.material) o.material = o.material.clone(); });
    fallers.push({
      mesh,
      vel: new THREE.Vector3(
        (Math.random() - 0.5) * 2.5,
        -1 - Math.random() * 2,
        1.5 + Math.random() * 2.5
      ),
      ang: new THREE.Vector3(
        (Math.random() - 0.5) * 9,
        (Math.random() - 0.5) * 9,
        (Math.random() - 0.5) * 9
      ),
      bounces: 0,
      fade: -0.8 - Math.random() * 0.8        // delay before fading starts
    });
  }
  pieces = [];
  resetGrid();
  clearTimeout(resetTimer);
  resetTimer = setTimeout(freshRound, 2100);
}

function freshRound() {
  if (state !== 'spilling') return;
  spilledThisFlip = false;
  state = 'player';
  finaleEl.classList.remove('show', 'loss', 'draw');
  setStatus('player', 'DEIN ZUG');
}

function updateFallers(dt) {
  for (let i = fallers.length - 1; i >= 0; i--) {
    const f = fallers[i];
    f.vel.y -= GRAVITY * dt;
    f.mesh.position.addScaledVector(f.vel, dt);
    f.mesh.rotation.x += f.ang.x * dt;
    f.mesh.rotation.y += f.ang.y * dt;
    f.mesh.rotation.z += f.ang.z * dt;
    const groundY = FLOOR_Y + DISC_R * 0.7;
    if (f.mesh.position.y < groundY && f.vel.y < 0) {
      f.mesh.position.y = groundY;
      f.vel.y = -f.vel.y * 0.38;
      f.vel.x *= 0.75; f.vel.z *= 0.75;
      f.ang.multiplyScalar(0.6);
      f.bounces++;
      if (f.bounces <= 3 && Math.abs(f.vel.y) > 1) {
        sfx.clack(Math.min(1, Math.abs(f.vel.y) / 6));
        spawnBurst(f.mesh.position, 3, { speed: 1.5, up: 1.2, color: new THREE.Color('#b07a3a') });
      }
    }
    f.fade += dt;
    if (f.fade > 0) {
      let op = 1 - f.fade / 0.7;
      if (op <= 0) {
        scene.remove(f.mesh);
        fallers.splice(i, 1);
        continue;
      }
      f.mesh.traverse(o => {
        if (o.material) { o.material.transparent = true; o.material.opacity = op; }
      });
    }
  }
}

function updateRoll(dt) {
  if (autoFlip) {
    autoFlip.t += dt;
    const t = autoFlip.t;
    if (t < 0.9) {
      const k = 1 - Math.pow(1 - t / 0.9, 4);  // ease-out-quart
      roll = k * Math.PI * 1.04;
    } else if (t < 1.35) {
      roll = Math.PI * 1.04;
    } else {
      roll = roll - Math.PI * 2;               // continue rotation direction
      rollVel = 0;
      autoFlip = null;
    }
  } else if (!draggingBoard) {
    // critically damped spring back to upright
    rollVel += (-roll * 42 - rollVel * 11) * dt;
    roll += rollVel * dt;
    if (Math.abs(roll) < 0.001 && Math.abs(rollVel) < 0.01) { roll = 0; rollVel = 0; }
  }
  if (Math.abs(wrapAngle(roll)) > SPILL_ANGLE && (pieces.length || dropping)) spillPieces();
  rollGroup.rotation.x = roll;
}

/* ============================================================
   INPUT · hover, click-to-drop, drag-to-flip
============================================================ */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2(-10, -10);
let mouseNX = 0, mouseNY = 0;                 // normalized -1..1 for tilt
let pointerDown = null;                       // { x, y }
let hoverCol = -1;

function setPointer(e) {
  pointerNDC.x = (e.clientX / innerWidth) * 2 - 1;
  pointerNDC.y = -(e.clientY / innerHeight) * 2 + 1;
  mouseNX = pointerNDC.x;
  mouseNY = pointerNDC.y;
}

function columnAt(clientX, clientY) {
  raycaster.setFromCamera(
    new THREE.Vector2((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1),
    camera
  );
  const hit = raycaster.intersectObject(pickPlane)[0];
  if (!hit) return -1;
  const local = rollGroup.worldToLocal(hit.point.clone());
  const c = Math.round(local.x / CELL + (COLS - 1) / 2);
  return (c >= 0 && c < COLS) ? c : -1;
}

canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  pointerDown = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  setPointer(e);
  if (pointerDown && !draggingBoard && !autoFlip) {
    const dx = e.clientX - pointerDown.x, dy = e.clientY - pointerDown.y;
    if (Math.hypot(dx, dy) > 12) {
      draggingBoard = true;
      canvas.classList.add('dragging');
      dragStartY = e.clientY;
      rollAtDragStart = roll;
      ghost.visible = false; beam.visible = false;
    }
  }
  if (draggingBoard) {
    // pull down: the board bows forward toward you, keep pulling and it tips over
    roll = rollAtDragStart + (e.clientY - dragStartY) * DRAG_TO_PITCH;
  }
});

canvas.addEventListener('pointerup', e => {
  const wasDrag = draggingBoard;
  if (draggingBoard) {
    draggingBoard = false;
    canvas.classList.remove('dragging');
    roll = wrapAngle(roll);
    rollVel = 0;
  }
  if (!wasDrag && pointerDown && state === 'player') {
    const col = columnAt(e.clientX, e.clientY);
    if (col >= 0) tryDrop(col);
  }
  pointerDown = null;
});

canvas.addEventListener('pointercancel', () => {
  pointerDown = null;
  if (draggingBoard) { draggingBoard = false; canvas.classList.remove('dragging'); roll = wrapAngle(roll); rollVel = 0; }
});

function tryDrop(col) {
  if (state !== 'player') return;
  if (Math.abs(wrapAngle(roll)) > 0.5) return;   // board is mid-flip
  if (heights[col] >= ROWS) {
    sfx.denied();
    if (!REDUCED_MOTION) shake = Math.max(shake, 0.03);
    return;
  }
  if (!roundStart) roundStart = performance.now();
  playerMoves++;
  startDrop(col, HU);
}

addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '7') { ensureAudio(); tryDrop(+e.key - 1); }
  if (e.key === 'r' || e.key === 'R') restartFlip();
  if (e.key === 'Escape') lbPanel.classList.remove('open');
});

/* Status helper */
const statusEl = document.getElementById('status');
const turnText = document.getElementById('turn-text');
function setStatus(side, text) {
  statusEl.classList.toggle('cpu', side === 'cpu');
  turnText.textContent = text;
}

/* Restart: the board flips itself over. Same spill, full theatre. */
function restartFlip() {
  if (autoFlip || state === 'spilling') return;
  ensureAudio();
  clearTimeout(pendingAiTimer);
  finaleEl.classList.remove('show');
  if (!pieces.length && !dropping) {           // nothing to spill: quiet reset
    resetGrid();
    state = 'player';
    setStatus('player', 'DEIN ZUG');
    return;
  }
  autoFlip = { t: 0 };
  sfx.whoosh();
}
document.getElementById('btn-restart').addEventListener('click', restartFlip);
document.getElementById('btn-again').addEventListener('click', restartFlip);

/* Difficulty selector */
const diffButtons = document.querySelectorAll('.difficulty button');
function renderDiff() {
  diffButtons.forEach(b => b.classList.toggle('active', b.dataset.d === diffKey));
}
renderDiff();
diffButtons.forEach(b => b.addEventListener('click', () => {
  ensureAudio();
  diffKey = b.dataset.d;
  localStorage.setItem('sk-diff', diffKey);
  renderDiff();
  sfx.tick();
}));

/* Sound toggle */
const btnSound = document.getElementById('btn-sound');
function renderSoundBtn() {
  btnSound.textContent = muted ? 'TON AN' : 'TON AUS';
  btnSound.setAttribute('aria-pressed', String(!muted));
}
renderSoundBtn();
btnSound.addEventListener('click', () => {
  ensureAudio();
  muted = !muted;
  localStorage.setItem('sk-muted', muted ? '1' : '0');
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.9;
  renderSoundBtn();
  if (!muted) sfx.clack(1);
});

/* ============================================================
   MAIN LOOP
============================================================ */
const clock = new THREE.Clock();
let lastHover = -1;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* Mouse parallax: board leans away from the cursor */
  const targetRotY = mouseNX * 0.16;
  const targetRotX = -mouseNY * 0.10;
  tiltGroup.rotation.y += (targetRotY - tiltGroup.rotation.y) * Math.min(1, dt * 5);
  tiltGroup.rotation.x += (targetRotX - tiltGroup.rotation.x) * Math.min(1, dt * 5);

  updateRoll(dt);
  updateDrop(dt);
  updateFallers(dt);
  updateParticles(dt);
  updateEmbers(dt, t);

  /* Hover ghost + column beam */
  if (state === 'player' && !draggingBoard && !autoFlip && pointerNDC.x > -5) {
    raycaster.setFromCamera(pointerNDC, camera);
    const hit = raycaster.intersectObject(pickPlane)[0];
    hoverCol = -1;
    if (hit) {
      const local = rollGroup.worldToLocal(hit.point.clone());
      const c = Math.round(local.x / CELL + (COLS - 1) / 2);
      if (c >= 0 && c < COLS && heights[c] < ROWS) hoverCol = c;
    }
    if (hoverCol >= 0) {
      ghost.visible = beam.visible = true;
      ghost.position.set(cellX(hoverCol), SPAWN_Y, 0);
      beam.position.x = cellX(hoverCol);
      if (hoverCol !== lastHover) sfx.tick();
    } else {
      ghost.visible = beam.visible = false;
    }
    lastHover = hoverCol;
  } else {
    ghost.visible = beam.visible = false;
    lastHover = -1;
  }

  /* Win discs pulse */
  if (winDiscs.length) {
    const pulse = 0.5 + Math.sin(t * 6) * 0.45;
    for (const p of winDiscs) {
      p.mesh.children[0].material.emissiveIntensity = 0.4 + pulse;
    }
    winBeamMat.opacity = 0.25 + pulse * 0.3;
  }

  /* Impact ring expansion */
  if (ringT < 1) {
    ringT = Math.min(1, ringT + dt * 2.6);
    const s = (0.4 + ringT * 2.4) * ringPower;
    impactRing.scale.set(s, s, 1);
    ringMat.opacity = 0.5 * (1 - ringT);
    if (ringT >= 1) impactRing.visible = false;
  }

  /* Flash decay */
  if (flashT < 1) {
    flashT = Math.min(1, flashT + dt * 4);
    flash.intensity *= Math.exp(-9 * dt);
  }

  /* Camera shake */
  if (shake > 0.001) {
    camera.position.set(
      CAM_BASE.x + (Math.random() - 0.5) * shake,
      CAM_BASE.y + (Math.random() - 0.5) * shake,
      CAM_BASE.z
    );
    shake *= Math.exp(-5.5 * dt);
  } else {
    camera.position.copy(CAM_BASE);
  }
  camera.lookAt(0, 0.1, 0);

  composer.render();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  fitCamera();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

setStatus('player', 'DEIN ZUG');
animate();

/* Debug handle for automated smoke tests */
window.__sk = {
  tryDrop,
  state: () => state,
  pieces: () => pieces.map(p => ({ col: p.col, row: p.row, owner: p.owner })),
  forceWin: () => { playerMoves = 4; roundStart = performance.now() - 21000; endRound(HU, null); }
};
</script>
